# Installed once on the VPS as /opt/yercaud/nginx/user_conf.d/cal-tracker.conf (the yercaud
# project's nginx-certbot container). That image requests a Let's Encrypt certificate for the
# server_names of every block naming /etc/letsencrypt/live/<name>/privkey.pem, so both hostnames
# share the cal.aiwithgowtham.in certificate. yercaud.conf defines `resolver` and
# $connection_upgrade; proxy_pass uses a variable so container IPs are re-resolved per request.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name cal.aiwithgowtham.in;

	ssl_certificate /etc/letsencrypt/live/cal.aiwithgowtham.in/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/cal.aiwithgowtham.in/privkey.pem;

	location / {
		set $upstream_cal_frontend http://cal-frontend:3000;
		proxy_pass $upstream_cal_frontend;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name cal-api.aiwithgowtham.in;

	ssl_certificate /etc/letsencrypt/live/cal.aiwithgowtham.in/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/cal.aiwithgowtham.in/privkey.pem;

	# Food photos are uploaded as raw images of up to 10 MB; stay above that so the API itself
	# answers oversized ones with its CORS-carrying error instead of a bare nginx 413.
	client_max_body_size 12m;

	location / {
		set $upstream_cal_backend http://cal-backend:4000;
		proxy_pass $upstream_cal_backend;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# The coach and plan generation stream their answers; pass each chunk on as it arrives.
		proxy_buffering off;
		proxy_read_timeout 300s;
	}
}
