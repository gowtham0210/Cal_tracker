name: Test and deploy

# Pull requests run the tests. Pushes to the main branch also build the backend and frontend
# images, push them to GHCR, and deploy them to the VPS over SSH, where the containers join the
# yercaud project's shared nginx (see deploy/docker-compose.prod.yml and deploy/nginx/).
on:
  push:
    branches: [claude/weight-loss-tracker-app-4acl9g]
  pull_request:
  workflow_dispatch: {}

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/gowtham0210/cal-tracker
  API_URL: https://cal-api.aiwithgowtham.in/api/v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend typecheck and tests
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Frontend lint and typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # The compose file travels inside the one SSH session (as base64 in an env var): a second
      # connection right after the first, as a separate scp step would open, has been timing
      # out against this VPS.
      - name: Encode the compose file
        run: echo "COMPOSE_B64=$(base64 -w0 deploy/docker-compose.prod.yml)" >> "$GITHUB_ENV"

      - name: Pull and restart the containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: COMPOSE_B64,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -eu
            cd /opt/cal-tracker
            echo "$COMPOSE_B64" | base64 -d > docker-compose.prod.yml
            # A registry login of this app's own, so the other apps' logins on this server stay as they are.
            export DOCKER_CONFIG=/opt/cal-tracker/.docker
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans --wait --wait-timeout 120
            docker logout ghcr.io
            docker image prune -f
